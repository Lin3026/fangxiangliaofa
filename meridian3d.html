<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>经络 3D 可视化</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0e1116; color: #e8edf2; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; }
  #canvasWrap { position: absolute; inset: 0; touch-action: none; }
  #topbar { position: absolute; top: 0; left: 0; right: 0; padding: 8px 12px;
    font-size: 13px; color: #9fb2c4; background: linear-gradient(#0e1116cc, #0e111600);
    pointer-events: none; }
  #topbar b { color: #e8edf2; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; font-size: 15px; line-height: 1.7; color: #9fb2c4; }
  /* 经络选择面板 */
  #panel { position: absolute; top: 96px; left: 10px; width: 140px; max-height: calc(100vh - 200px); overflow-y: auto;
    background: rgba(18,24,32,.92); border: 1px solid #2a3340; border-radius: 10px; padding: 8px; }
  #panel h4 { margin: 0 0 6px; font-size: 12px; color: #9fb2c4; font-weight: 600; }
  .mrow { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px; cursor: pointer;
    font-size: 12.5px; user-select: none; }
  .mrow:hover { background: #1d2733; }
  .mrow.off { opacity: .4; }
  .mdot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
  /* 底部控制条（大按钮，适合触摸） */
  #ctrl { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(#0e111600, #0e1116dd); }
  .btn { min-height: 44px; padding: 0 16px; border-radius: 22px;
    border: 1px solid #2f3a48; background: #1a222c; color: #e8edf2; font-size: 14px; cursor: pointer; }
  .btn:active { background: #25313f; }
  .btn.on { background: #1e6f5c; border-color: #28a98c; color: #eafff7; }
  #searchbar { position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    width: min(360px, calc(100% - 16px)); display: flex; gap: 6px; z-index: 5; }
  #searchInput { flex: 1; min-height: 40px; padding: 0 14px; border-radius: 20px;
    border: 1px solid #2f3a48; background: #161d26; color: #e8edf2; font-size: 14px; outline: none; }
  #searchInput::placeholder { color: #7d8c9a; }
  #btnSearch { min-height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #28a98c;
    background: #1e6f5c; color: #eafff7; font-size: 14px; cursor: pointer; }
  #hint { position: absolute; top: 52px; left: 0; right: 0; text-align: center;
    font-size: 11.5px; color: #6f8296; pointer-events: none; }
  #status { position: absolute; top: 96px; left: 50%; transform: translateX(-50%);
    max-width: 90%; padding: 6px 12px; font-size: 12px; border-radius: 6px;
    background: rgba(20,28,38,.95); border: 1px solid #2f3a48; color: #9fb2c4;
    pointer-events: none; z-index: 10; white-space: pre-wrap; word-break: break-all; }
  #status.ok { border-color: #28a98c; color: #eafff7; }
  #status.err { border-color: #e74c3c; color: #ffb8ae; font-weight: 600; }
  #result { position: absolute; top: 74px; left: 50%; transform: translateX(-50%);
    background: rgba(20,28,38,.95); border: 1px solid #28a98c; border-radius: 16px;
    padding: 6px 14px; font-size: 13px; color: #eafff7; display: none; z-index: 6; max-width: 90%; }
</style>
</head>
<body>
<div id="app">
  <div id="canvasWrap"></div>
  <div id="searchbar">
    <input id="searchInput" type="search" placeholder="搜索穴位或经络，如 足三里 / 肺经" />
    <button id="btnSearch">定位</button>
  </div>
  <div id="hint">默认经络全关 · 点左侧经络开启 · 拖拽旋转 / 双指捏合缩放 · 搜穴位名自动聚焦</div>
  <div id="status" style="display:none"></div>
  <div id="result"></div>
  <div id="loading">正在加载 3D 模型…<br/>（首次需下载约 12MB，请稍候，加载完可旋转/缩放）</div>
  <div id="panel"><h4>经络（点击显隐）</h4><div id="mList"></div></div>
  <div id="ctrl">
    <button class="btn" id="btnSkeleton">🦴 骨骼：关</button>
    <button class="btn on" id="btnQi">🌀 气运动：开</button>
    <button class="btn on" id="btnLabels">🏷 穴位名：开</button>
    <button class="btn" id="btnReset">↺ 复位视角</button>
    <button class="btn on" id="btnSkin">👤 皮肤：透明</button>
  </div>
</div>

<script>
/* 防御：模块若加载/解析失败，直接在画面显示错误，避免手机上静默空白 */
function _m3dErr(msg){
  var s=document.getElementById('loading');
  if(s){ s.style.display='block'; s.style.color='#ff8a8a'; s.innerHTML='⚠️ 3D 加载出错：'+msg+'<br/>请截图发我以便定位'; }
}
window.addEventListener('error', function(e){ _m3dErr((e&&e.message)|| (e&&e.error) || '未知错误'); });
window.addEventListener('unhandledrejection', function(e){ _m3dErr((e&&e.reason&&e.reason.message)|| (e&&e.reason) || '未知错误'); });
</script>

<script type="module">
import * as THREE from './libs/three.module.js';
import { OrbitControls } from './libs/jsm/controls/OrbitControls.js';
import { FBXLoader } from './libs/jsm/loaders/FBXLoader.js';

document.getElementById('loading').style.display = 'none';

/* 状态提示：模型加载成功/失败/网络问题都直观显示在画面上 */
const _statusEl = document.getElementById('status');
function showStatus(msg, kind) {
  _statusEl.textContent = msg;
  _statusEl.className = kind || '';
  _statusEl.style.display = 'block';
  if (kind === 'ok') setTimeout(() => { _statusEl.style.display = 'none'; }, 4000);
}
function showStatusRetry(msg, retryFn) {
  _statusEl.innerHTML = msg + ' <a id="retryBtn" style="color:#28a98c;cursor:pointer;text-decoration:underline;pointer-events:auto;">🔄 重试</a>';
  _statusEl.className = 'err';
  _statusEl.style.display = 'block';
  _statusEl.style.pointerEvents = 'auto';
  const btn = document.getElementById('retryBtn');
  if (btn) btn.onclick = () => { _statusEl.style.display = 'none'; retryFn && retryFn(); };
}

/* ============ 基础场景 ============ */
const wrap = document.getElementById('canvasWrap');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0, 1.05, 2.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
wrap.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.7;
controls.maxDistance = 7;

scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const dl = new THREE.DirectionalLight(0xffffff, 0.7);
dl.position.set(2, 3, 2.5);
scene.add(dl);
const dl2 = new THREE.DirectionalLight(0x88aaff, 0.3);
dl2.position.set(-2, 1, -2);
scene.add(dl2);

/* ============ 文字标签（始终朝向相机、不被遮挡） ============ */
function makeLabel(text, color = '#eaf2ff') {
  const fs = 24, pad = 8;
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = `bold ${fs}px sans-serif`;
  const w = Math.ceil(ctx.measureText(text).width) + pad * 2;
  const h = fs + pad * 2;
  c.width = w; c.height = h;
  ctx.font = `bold ${fs}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(8,12,18,0.92)';
  ctx.strokeText(text, w / 2, h / 2);
  ctx.fillStyle = color; ctx.fillText(text, w / 2, h / 2);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
  const sp = new THREE.Sprite(mat);
  const sc = 0.0015;
  sp.scale.set(w * sc, h * sc, 1);
  return sp;
}

/* ============ 通用：两点间的"杆/肢段" ============ */
function segment(posA, posB, radius, material) {
  const a = new THREE.Vector3(posA[0], posA[1], posA[2]);
  const b = new THREE.Vector3(posB[0], posB[1], posB[2]);
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const geo = new THREE.CapsuleGeometry(radius, Math.max(0.001, len - 2 * radius), 4, 8);
  const m = new THREE.Mesh(geo, material);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  if (len > 1e-5) m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  return m;
}

/* ============ 程序化"示意人体"（半透明，作为底） ============ */
const bodyGroup = new THREE.Group();
scene.add(bodyGroup);
const skinMat = new THREE.MeshPhongMaterial({ color: 0xd2a892, transparent: true, opacity: 0.13, depthWrite: false, shininess: 10 });

const head = new THREE.Mesh(new THREE.SphereGeometry(0.105, 24, 18), skinMat);
head.position.set(0, 1.60, 0);
bodyGroup.add(head);
bodyGroup.add(segment([0, 1.46, 0], [0, 1.40, 0], 0.04, skinMat));      // 颈
bodyGroup.add(segment([0, 1.36, 0], [0, 1.02, 0], 0.115, skinMat));    // 胸腹
bodyGroup.add(segment([0, 0.96, 0], [0, 0.80, 0], 0.10, skinMat));     // 盆
[-1, 1].forEach(s => {
  bodyGroup.add(segment([0.18 * s, 1.36, 0], [0.34 * s, 1.08, 0], 0.034, skinMat)); // 上臂
  bodyGroup.add(segment([0.34 * s, 1.05, 0], [0.43 * s, 0.82, 0], 0.030, skinMat)); // 前臂
  bodyGroup.add(segment([0.43 * s, 0.79, 0], [0.45 * s, 0.70, 0], 0.026, skinMat)); // 手
  bodyGroup.add(segment([0.09 * s, 0.78, 0], [0.11 * s, 0.50, 0.01], 0.05, skinMat)); // 大腿
  bodyGroup.add(segment([0.11 * s, 0.48, 0.01], [0.11 * s, 0.10, 0.02], 0.04, skinMat)); // 小腿
  const foot = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.035, 0.16), skinMat);
  foot.position.set(0.11 * s, 0.035, 0.06);
  bodyGroup.add(foot);
});

/* ============ 标签登记（用于防重叠与搜索聚焦） ============ */
const labelItems = [];

/* ============ 骨骼（可开关显示） ============ */
const skeletonGroup = new THREE.Group();
skeletonGroup.visible = false;
scene.add(skeletonGroup);
const boneMat = new THREE.MeshPhongMaterial({ color: 0xe9e4d6 });
const jointMat = new THREE.MeshPhongMaterial({ color: 0xf3efe2 });

const joints = {
  head: [0, 1.60, 0], neck: [0, 1.44, -0.01], chest: [0, 1.22, -0.03],
  spine: [0, 1.00, -0.05], pelvis: [0, 0.84, -0.04],
  L_shoulder: [-0.17, 1.36, 0], R_shoulder: [0.17, 1.36, 0],
  L_elbow: [-0.33, 1.08, 0], R_elbow: [0.33, 1.08, 0],
  L_wrist: [-0.44, 0.82, 0], R_wrist: [0.44, 0.82, 0],
  L_hip: [-0.09, 0.82, 0], R_hip: [0.09, 0.82, 0],
  L_knee: [-0.11, 0.48, 0.01], R_knee: [0.11, 0.48, 0.01],
  L_ankle: [-0.11, 0.07, 0.02], R_ankle: [0.11, 0.07, 0.02]
};
const boneLinks = [
  ['head', 'neck', '颈椎'], ['neck', 'chest', '胸椎上段'], ['chest', 'spine', '胸椎下段'],
  ['spine', 'pelvis', '腰椎/骶骨'], ['chest', 'L_shoulder', '左锁骨'], ['chest', 'R_shoulder', '右锁骨'],
  ['L_shoulder', 'L_elbow', '左肱骨'], ['L_elbow', 'L_wrist', '左前臂骨'],
  ['R_shoulder', 'R_elbow', '右肱骨'], ['R_elbow', 'R_wrist', '右前臂骨'],
  ['pelvis', 'L_hip', '左髂骨'], ['pelvis', 'R_hip', '右髂骨'],
  ['L_hip', 'L_knee', '左股骨'], ['L_knee', 'L_ankle', '左胫腓骨'],
  ['R_hip', 'R_knee', '右股骨'], ['R_knee', 'R_ankle', '右胫腓骨']
];
const boneNameLabels = [];
boneLinks.forEach(([a, b, label]) => {
  skeletonGroup.add(segment(joints[a], joints[b], 0.018, boneMat));
  const sp = makeLabel(label, '#fff3d6');
  sp.position.set((joints[a][0] + joints[b][0]) / 2, (joints[a][1] + joints[b][1]) / 2 + 0.03, (joints[a][2] + joints[b][2]) / 2);
  skeletonGroup.add(sp);
  boneNameLabels.push(sp);
  labelItems.push({ sprite: sp, type: 'bone', world: sp.position.clone(), force: false });
});
Object.values(joints).forEach(p => {
  const j = new THREE.Mesh(new THREE.SphereGeometry(0.022, 12, 10), jointMat);
  j.position.set(p[0], p[1], p[2]);
  skeletonGroup.add(j);
});

/* ============ 真实 3D 模型（外表面 + 骨骼）替换程序化 ============ */
/* 用户提供 models/human1.fbx（外表面）、models/guge1.fbx（骨骼）。
   已确认两模型均为站立人形、米级（≈1 米高）；FBX 体积仅为 GLB 的 ≈1/4，更适合 Pages。
   自动对齐（自适应轴向，兼容 Y-up 或 Z-up 导出）：
   等比缩放到身高 1.8、脚底 y=0、左右/前后居中，与现有经络坐标系一致。 */
const fbxLoader = new FBXLoader();
let realSkin = null, realSkeleton = null, hasRealSkeleton = false;

function alignModel(obj, targetH = 1.8) {
  obj.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3(); box.getSize(size);
  const ext = [size.x, size.y, size.z];
  const maxI = ext.indexOf(Math.max(...ext)); // 最长边视为"身高"方向
  obj.scale.setScalar(targetH / ext[maxI]);
  // 若身高轴不在 Y，旋转到 Y（兼容 FBX 默认 Z-up 导出）
  if (maxI === 2) obj.rotation.x = -Math.PI / 2;     // Z-up -> Y-up
  else if (maxI === 0) obj.rotation.z = Math.PI / 2; // X-up -> Y-up
  obj.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(obj);
  const c = new THREE.Vector3(); box.getCenter(c);
  obj.position.x -= c.x;
  obj.position.z -= c.z;
  obj.position.y -= box.min.y; // 脚底落到 y=0
  obj.updateMatrixWorld(true);
}

function loadRealModels() {
  // 外表面：适度半透明让经络/穴位可见；高 emissive 让贴图提亮不被深色背景吞没
  fbxLoader.load('models/human1.fbx', (obj) => {
    realSkin = obj;
    obj.traverse(o => {
      if (o.isMesh && o.material) {
        const mat = o.material;
        // 保留原始贴图（带皮肤纹理）+ 高 emissive 让贴图自发光，避免 #0e1116 背景吞没
        mat.transparent = true;
        mat.opacity = 0.78;
        mat.depthWrite = true;
        mat.side = THREE.DoubleSide;
        mat.color = new THREE.Color(0xffffff);        // 贴图颜色不被基础色压暗
        mat.emissive = new THREE.Color(0xdddddd);     // 高自发光，把贴图照亮
        mat.emissiveIntensity = 0.55;
        mat.emissiveMap = mat.map;                    // 用贴图作为发光贴图，整体亮度+细节都保留
        mat.needsUpdate = true;
        o.frustumCulled = false;
        o.userData.transparentMode = true;
      }
    });
    alignModel(realSkin);
    scene.add(realSkin);
    bodyGroup.visible = false;
    showStatus && showStatus('✅ 外表面模型已加载（透明皮肤）', 'ok');
  }, undefined, (e) => {
    const detail = (e && e.message) || (e && e.toString()) || String(e);
    console.error('外表面加载失败：', e, 'URL: models/human1.fbx, 当前协议:', location.protocol);
    showStatusRetry('❌ 外表面加载失败：' + detail + '（协议：' + location.protocol + '）', () => loadRealModels());
  });

  // 骨骼：加载真实骨骼，隐藏程序化骨杆保留中文骨名标签；默认隐藏，由开关控制
  fbxLoader.load('models/guge1.fbx', (obj) => {
    realSkeleton = obj;
    obj.traverse(o => {
      if (o.isMesh && o.material) {
        const mat = o.material;
        mat.transparent = true;
        mat.opacity = 0.92;
        mat.color = new THREE.Color(0xffffff);
        mat.emissive = new THREE.Color(0xfff3d6);
        mat.emissiveIntensity = 0.6;
        mat.emissiveMap = mat.map;
        mat.depthWrite = true;
        mat.side = THREE.DoubleSide;
        mat.needsUpdate = true;
        o.frustumCulled = false;
      }
    });
    alignModel(realSkeleton);
    realSkeleton.visible = false;
    scene.add(realSkeleton);
    hasRealSkeleton = true;
    skeletonGroup.children.forEach(c => { if (c.type === 'Mesh') c.visible = false; });
    showStatus && showStatus('✅ 骨骼模型已加载', 'ok');
  }, undefined, (e) => {
    const detail = (e && e.message) || (e && e.toString()) || String(e);
    console.error('骨骼加载失败：', e, 'URL: models/guge1.fbx, 当前协议:', location.protocol);
    // 常见原因提示：预览面板无法访问 models/ 目录
    const hint = location.host.startsWith('127.0.0.1:6022')
      ? '（提示：你正在用预览面板，它只能服务单个 HTML 文件，请双击 start_server.bat 或推到 GitHub Pages 加载骨骼）'
      : '';
    showStatusRetry('❌ 骨骼加载失败：' + detail + '（协议：' + location.protocol + '）' + hint, () => { if (realSkin) { realSkeleton = null; hasRealSkeleton = false; } loadRealModels(); });
  });
}

/* ============ 经络数据（14 条：十二正经 + 任脉 + 督脉） ============ */
/* pts 格式：[穴位名, x, y, z]；side: 'M'=中线单条, 'LR'=左右对称各一条 */
const MERIDIANS = [
  { id: 'ren', name: '任脉', color: 0xff5fa2, side: 'M', pts: [
    ['会阴', 0, 0.06, 0.10], ['曲骨', 0, 0.78, 0.13], ['关元', 0, 0.88, 0.13], ['气海', 0, 0.95, 0.13],
    ['神阙', 0, 1.00, 0.14], ['中脘', 0, 1.10, 0.13], ['膻中', 0, 1.32, 0.12], ['天突', 0, 1.45, 0.10], ['承浆', 0, 1.50, 0.10]
  ]},
  { id: 'du', name: '督脉', color: 0xffd24a, side: 'M', pts: [
    ['长强', 0, 0.12, -0.10], ['命门', 0, 1.00, -0.10], ['大椎', 0, 1.42, -0.04], ['风府', 0, 1.55, -0.03],
    ['百会', 0, 1.70, 0], ['印堂', 0, 1.58, 0.10], ['水沟', 0, 1.50, 0.12]
  ]},
  { id: 'lu', name: '手太阴肺经', color: 0x6fd3ff, side: 'LR', pts: [
    ['中府', 0.16, 1.30, 0.10], ['尺泽', 0.30, 1.08, 0.02], ['列缺', 0.38, 0.86, 0.06], ['太渊', 0.40, 0.84, 0.04], ['少商', 0.45, 0.72, 0.04]
  ]},
  { id: 'li', name: '手阳明大肠经', color: 0x7CFC00, side: 'LR', pts: [
    ['商阳', 0.45, 0.72, 0.04], ['合谷', 0.42, 0.80, 0.06], ['曲池', 0.32, 1.08, 0.04], ['肩髃', 0.18, 1.36, 0.02], ['迎香', 0.04, 1.50, 0.13]
  ]},
  { id: 'st', name: '足阳明胃经', color: 0xff9f43, side: 'LR', pts: [
    ['承泣', 0.04, 1.52, 0.13], ['地仓', 0.05, 1.48, 0.13], ['缺盆', 0.12, 1.34, 0.06], ['天枢', 0.10, 0.95, 0.14],
    ['梁丘', 0.12, 0.56, 0.05], ['足三里', 0.12, 0.55, 0.04], ['丰隆', 0.12, 0.30, 0.06], ['厉兑', 0.11, 0.03, 0.14]
  ]},
  { id: 'sp', name: '足太阴脾经', color: 0xc792ea, side: 'LR', pts: [
    ['隐白', 0.13, 0.03, 0.12], ['公孙', 0.12, 0.07, 0.11], ['三阴交', 0.11, 0.10, 0.10], ['阴陵泉', 0.12, 0.50, 0.04],
    ['血海', 0.13, 0.62, 0.02], ['大横', 0.09, 0.95, 0.12], ['大包', 0.16, 1.18, 0.04]
  ]},
  { id: 'ht', name: '手少阴心经', color: 0xff6b81, side: 'LR', pts: [

/* ============ 生成经络曲线 + 穴位标签 + 气运动粒子 ============ */
const meridianGroup = new THREE.Group();
scene.add(meridianGroup);
const qiGroup = new THREE.Group();
scene.add(qiGroup);

const meridianObjs = []; // 每条"单侧"一个对象

function hex(c) { return '#' + c.toString(16).padStart(6, '0'); }

/* 气运动：沿经络流动的"线"（发光脉冲，而非散点） */
const flowVert = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const flowFrag = `uniform vec3 uColor; uniform float uTime; uniform float uSpeed; varying vec2 vUv;
void main(){
  float x = vUv.x;
  float p = fract(x - uTime * uSpeed);
  float head = smoothstep(0.75, 1.0, p);
  float intensity = 0.16 + head * 1.7;
  gl_FragColor = vec4(uColor * intensity, 1.0);
}`;
const dotGeo = new THREE.SphereGeometry(0.012, 12, 10);

MERIDIANS.forEach(m => {
  const sides = m.side === 'M' ? [1] : [-1, 1];
  sides.forEach(sgn => {
    const obj = { def: m, labels: [], dots: [], sgn };
    const vp = m.pts.map(p => new THREE.Vector3(p[1] * sgn, p[2], p[3]));
    const curve = new THREE.CatmullRomCurve3(vp);
    obj.curve = curve;

    m.pts.forEach(p => {
      // 穴位"点"
      const dot = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color: m.color }));
      dot.position.set(p[1] * sgn, p[2], p[3]);
      meridianGroup.add(dot);
      obj.dots.push(dot);
      // 穴位名（显示在点的旁边）
      const sp = makeLabel(p[0], hex(m.color));
      sp.position.set(p[1] * sgn, p[2] + 0.025, p[3]);
      meridianGroup.add(sp);
      obj.labels.push(sp);
      labelItems.push({ sprite: sp, type: 'acu', o: obj, world: sp.position.clone(), force: false });
    });

    const geo = new THREE.TubeGeometry(curve, Math.max(24, vp.length * 8), 0.006, 8, false);
    const mat = new THREE.MeshBasicMaterial({ color: m.color });
    const tube = new THREE.Mesh(geo, mat);
    meridianGroup.add(tube);
    obj.tube = tube;

    // 气运动：沿经络流动的发光脉冲（成线，不是球）
    const flowGeo = new THREE.TubeGeometry(curve, 80, 0.009, 8, false);
    const QI_COLOR = 0xff3b30; // 气运动统一用红色，不与任何经络配色冲突
    const flowMat = new THREE.ShaderMaterial({
      uniforms: { uColor: { value: new THREE.Color(QI_COLOR) }, uTime: { value: 0 }, uSpeed: { value: 0.16 } },
      vertexShader: flowVert, fragmentShader: flowFrag,
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    });
    const flow = new THREE.Mesh(flowGeo, flowMat);
    qiGroup.add(flow);
    obj.flowMat = flowMat;

    // 默认全部关闭：启动哪条才显示哪条
    tube.visible = false;
    obj.dots.forEach(d => d.visible = false);
    obj.labels.forEach(l => l.visible = false);
    flow.visible = false;

    meridianObjs.push(obj);
  });
});

/* ============ 经络选择面板 ============ */
const mList = document.getElementById('mList');
const meridianToggles = [];
function setMeridianVisible(id, on) {
  meridianObjs.filter(o => o.def.id === id).forEach(o => {
    o.tube.visible = on;
    o.dots.forEach(d => d.visible = on);
    o.labels.forEach(l => l.visible = on);
    if (o.flow) o.flow.visible = on;
  });
  const row = meridianToggles.find(r => r._id === id);
  if (row) row.classList.toggle('off', !on);
}
MERIDIANS.forEach(m => {
  const row = document.createElement('div');
  row.className = 'mrow';
  row._id = m.id;
  row.innerHTML = `<span class="mdot" style="background:${hex(m.color)}"></span>${m.name}`;
  row.onclick = () => {
    const objs = meridianObjs.filter(o => o.def.id === m.id);
    setMeridianVisible(m.id, !objs[0].tube.visible);
  };
  row.classList.add('off');
  mList.appendChild(row);
  meridianToggles.push(row);
});

/* ============ 控制条交互 ============ */
let labelOn = true;
const btnSkeleton = document.getElementById('btnSkeleton');
const btnQi = document.getElementById('btnQi');
const btnLabels = document.getElementById('btnLabels');
const btnReset = document.getElementById('btnReset');
const btnSkin = document.getElementById('btnSkin');

let skeletonOn = false;
btnSkeleton.onclick = () => {
  skeletonOn = !skeletonOn;
  if (realSkeleton) realSkeleton.visible = skeletonOn;
  skeletonGroup.visible = skeletonOn; // 控制程序化骨杆(无真实时) + 中文骨名标签
  btnSkeleton.classList.toggle('on', skeletonOn);
  btnSkeleton.textContent = '🦴 骨骼：' + (skeletonOn ? '开' : '关');
};
btnQi.onclick = () => {
  qiGroup.visible = !qiGroup.visible;
  btnQi.classList.toggle('on', qiGroup.visible);
  btnQi.textContent = '🌀 气运动：' + (qiGroup.visible ? '开' : '关');
};
btnLabels.onclick = () => {
  labelOn = !labelOn;
  btnLabels.classList.toggle('on', labelOn);
  btnLabels.textContent = '🏷 穴位名：' + (labelOn ? '开' : '关');
};
/* 皮肤透明度切换：透明看经络 vs 实体看清模型细节 */
let skinTransparent = true;
btnSkin.onclick = () => {
  skinTransparent = !skinTransparent;
  if (realSkin) {
    realSkin.traverse(o => {
      if (o.isMesh && o.material) {
        o.material.opacity = skinTransparent ? 0.55 : 0.98;
        o.material.needsUpdate = true;
      }
    });
  }
  btnSkin.classList.toggle('on', skinTransparent);
  btnSkin.textContent = '👤 皮肤：' + (skinTransparent ? '透明' : '实体');
};
btnReset.onclick = () => {
  camera.position.set(0, 1.05, 2.5);
  controls.target.set(0, 1.0, 0);
  controls.update();
  clearFocus();
};

/* ============ 标签防重叠（屏幕空间贪心去重） ============ */
function updateLabelVisibility() {
  const items = [];
  for (const it of labelItems) {
    const base = it.type === 'acu' ? (it.o.tube.visible && labelOn) : (skeletonGroup.visible && labelOn);
    if (!base) { it.sprite.visible = false; continue; }
    const v = it.world.clone().project(camera);
    if (v.z < -1 || v.z > 1) { it.sprite.visible = false; continue; }
    items.push({ it, sx: (v.x * 0.5 + 0.5) * innerWidth, sy: (-v.y * 0.5 + 0.5) * innerHeight, depth: v.z });
  }
  items.sort((a, b) => a.depth - b.depth);
  const placed = [];
  const gap = 24;
  for (const it of items) {
    let ok = it.it.force;
    if (!ok) {
      for (const p of placed) {
        if (Math.abs(it.sx - p.sx) < gap && Math.abs(it.sy - p.sy) < gap) { ok = false; break; }
      }
    }
    it.it.sprite.visible = ok;
    if (ok) placed.push(it);
  }
}

/* ============ 搜索定位 ============ */
const searchInput = document.getElementById('searchInput');
const btnSearch = document.getElementById('btnSearch');
const resultEl = document.getElementById('result');
const hintEl = document.getElementById('hint');
let focusItems = [];
function clearFocus() {
  focusItems.forEach(f => { if (f.dot) f.dot.scale.setScalar(1); if (f.labelItem) f.labelItem.force = false; });
  focusItems = [];
}
function frameTo(target, dist) {
  controls.target.copy(target);
  const dir = new THREE.Vector3().subVectors(camera.position, controls.target);
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, 1);
  dir.normalize().multiplyScalar(dist);
  camera.position.copy(target).add(dir);
  controls.update();
}
function highlightPoint(pos, meridianId, pointName) {
  setMeridianVisible(meridianId, true);
  labelOn = true;
  btnLabels.classList.add('on');
  btnLabels.textContent = '🏷 穴位名：开';
  const obj = meridianObjs.find(o => o.def.id === meridianId);
  if (obj) {
    const idx = obj.def.pts.findIndex(p => p[0] === pointName);
    if (idx >= 0) {
      const dot = obj.dots[idx];
      const li = labelItems.find(i => i.sprite === obj.labels[idx]);
      if (dot) { dot.scale.setScalar(2.4); focusItems.push({ dot, labelItem: li }); }
      if (li) li.force = true;
    }
  }
  frameTo(pos, 0.5);
}
function doSearch(q) {
  q = (q || '').trim();
  if (!q) return;
  clearFocus();
  let acuHit = null, merHit = null;
  MERIDIANS.forEach(m => {
    const sides = m.side === 'M' ? [1] : [-1, 1];
    m.pts.forEach(p => { if (p[0].includes(q) && !acuHit) acuHit = { m, p, sgn: 1 }; });
    if ((m.name.includes(q) || m.id === q) && !merHit) merHit = m;
  });
  if (acuHit) {
    const pos = new THREE.Vector3(acuHit.p[1] * acuHit.sgn, acuHit.p[2], acuHit.p[3]);
    highlightPoint(pos, acuHit.m.id, acuHit.p[0]);
    resultEl.textContent = '定位：' + acuHit.p[0] + '（' + acuHit.m.name + '）';
    resultEl.style.display = 'block';
  } else if (merHit) {
    setMeridianVisible(merHit.id, true);
    const sides = merHit.side === 'M' ? [1] : [-1, 1];
    const box = new THREE.Box3();
    merHit.pts.forEach(p => sides.forEach(s => box.expandByPoint(new THREE.Vector3(p[1] * s, p[2], p[3]))));
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const dist = Math.max(size.x, size.y, size.z) * 1.6 + 0.4;
    frameTo(center, dist);
    resultEl.textContent = '定位经络：' + merHit.name;
    resultEl.style.display = 'block';
  } else {
    resultEl.textContent = '未找到：' + q;
    resultEl.style.display = 'block';
  }
  if (hintEl) hintEl.style.display = 'none';
}
btnSearch.onclick = () => doSearch(searchInput.value);
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(searchInput.value); });
searchInput.addEventListener('input', () => { if (!searchInput.value) { resultEl.style.display = 'none'; clearFocus(); if (hintEl) hintEl.style.display = ''; } });

/* ============ 动画循环 ============ */
const tmp = new THREE.Vector3();
function animate() {
  requestAnimationFrame(animate);
  const t = performance.now() * 0.00018;
  if (qiGroup.visible) {
    meridianObjs.forEach(o => { if (o.flowMat) o.flowMat.uniforms.uTime.value = t; });
  }
  updateLabelVisibility();
  controls.update();
  renderer.render(scene, camera);
}
animate();

/* 加载用户提供的真实 3D 模型（异步，加载完自动替换程序化人体/骨骼） */
loadRealModels();

/* ============ 自适应（手机旋转/窗口缩放） ============ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
