<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>经络3D · 中医芳香理疗</title>
<style>
  :root{
    --bg:#0e1116; --panel:#1a1f26; --line:#3a4148;
    --txt:#e7e8e9; --muted:#9aa0a6; --accent:#8ab87a;
    --accent-soft:rgba(138,184,122,.15);
    --warn:#e9b96e; --danger:#e07e7e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100vh;width:100%;overflow:hidden;}
  #main{display:flex;flex:1;min-height:0;overflow:hidden;}
  #side{width:260px;min-width:260px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 12px;gap:10px;overflow:auto;}
  #stage{flex:1;position:relative;overflow:hidden;}
  canvas{display:block;}
  h2{font-size:13px;color:var(--muted);margin:6px 0 4px;letter-spacing:1px;font-weight:600;text-transform:uppercase;}
  #search{display:flex;gap:6px;align-items:center;}
  #searchInput{flex:1;padding:7px 10px;background:#0b0e12;border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:13px;outline:none;}
  #searchInput:focus{border-color:var(--accent);}
  #searchClear{background:#0b0e12;border:1px solid var(--line);color:var(--txt);padding:6px 9px;border-radius:8px;cursor:pointer;font-size:12px;}
  .mList{display:flex;flex-direction:column;gap:4px;}
  .mRow{display:flex;align-items:center;gap:8px;padding:7px 9px;background:#0b0e12;border:1px solid var(--line);border-radius:7px;cursor:pointer;font-size:12.5px;transition:all .15s;}
  .mRow:hover{border-color:var(--accent);background:var(--accent-soft);}
  .mRow.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .mRow .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--c);box-shadow:0 0 6px var(--c);}
  .mRow .meta{margin-left:auto;color:var(--muted);font-size:11px;}
  #ctrl{padding:10px 12px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;}
  #ctrl button{background:#0b0e12;color:var(--txt);border:1px solid var(--line);padding:7px 11px;border-radius:7px;cursor:pointer;font-size:12.5px;}
  #ctrl button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  #ctrl button:hover{border-color:var(--accent);}
  #ctrl .yawCtl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:0 10px 0 4px;border-left:1px solid var(--line);margin-left:4px;}
  #ctrl .yawCtl input[type=range]{width:130px;accent-color:var(--accent);cursor:pointer;}
  #ctrl .yawCtl span{color:var(--accent);font-weight:600;min-width:46px;text-align:right;font-variant-numeric:tabular-nums;}
  #status{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:8px 16px;border-radius:18px;font-size:12.5px;backdrop-filter:blur(6px);border:1px solid var(--line);opacity:0;pointer-events:none;transition:opacity .3s;z-index:10;white-space:nowrap;max-width:80%;text-align:center;}
  #status.show{opacity:1;}
  #status.err{background:rgba(190,40,40,.7);border-color:#a04040;}
  #status.ok{background:rgba(50,120,50,.7);border-color:#3a8838;}
  #progress{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(20,25,32,.85);padding:24px 36px;border-radius:14px;font-size:14px;border:1px solid var(--line);text-align:center;backdrop-filter:blur(8px);z-index:20;min-width:280px;}
  #progress .pb{width:200px;height:6px;background:#1d2429;border-radius:3px;margin:12px auto 0;overflow:hidden;}
  #progress .pb span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s;}
  #progress.hide{display:none;}
  #info{position:absolute;bottom:10px;left:12px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:8px;font-size:11.5px;color:var(--muted);font-family:ui-monospace,Consolas,monospace;backdrop-filter:blur(4px);}
  #info b{color:var(--accent);font-weight:600;}
  @media(max-width:640px){
    #side{width:200px;min-width:200px;font-size:12.5px;}
    #ctrl button{padding:6px 8px;font-size:11.5px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <aside id="side">
      <div>
        <h2>经络 · 搜索</h2>
        <div id="search">
          <input id="searchInput" type="text" placeholder="搜穴位/经络名…" />
          <button id="searchClear" title="清空">✕</button>
        </div>
        <div id="searchHint" style="font-size:11px;color:var(--muted);margin-top:4px;min-height:14px;"></div>
      </div>
      <div>
        <h2>经络列表（点击切换）</h2>
        <div class="mList" id="mList"></div>
      </div>
    </aside>
    <main id="stage">
      <div id="status"></div>
      <div id="progress"><div id="progText">正在加载 3D 模型…</div><div class="pb"><span id="progBar"></span></div></div>
      <div id="info">提示：<b>鼠标左键</b>旋转 · <b>右键</b>平移 · <b>滚轮</b>缩放</div>
    </main>
  </div>
  <div id="ctrl">
    <button id="bBody" class="on">👤 外表面</button>
    <button id="bBone">🦴 骨骼</button>
    <button id="bBoneLabels">🏷 骨骼名</button>
    <button id="bPoints" class="on">⦿ 穴位点</button>
    <button id="bLabels" class="on">🏷 穴位名</button>
    <button id="bFlow" class="on">🌀 气流动</button>
    <button id="bSnap" title="把每条经络投到最近的皮肤表面并贴合（表面投影）">🩹 自动贴合</button>
    <button id="bOrient" title="切换模型朝向(上下/前后/镜像)">🔄 朝向 1/5</button>
    <label class="yawCtl">顺时针微调 <input id="yawSlider" type="range" min="-180" max="180" step="1" value="-55" /> <span id="yawVal">-55°</span></label>
    <label class="yawCtl">经络对齐 <input id="meridianYawSlider" type="range" min="-90" max="90" step="1" value="0" /> <span id="meridianYawVal">0°</span></label>
    <label class="yawCtl">贴合偏移 <input id="offsetSlider" type="range" min="0" max="30" step="1" value="12" /> <span id="offsetVal">12mm</span></label>
    <button id="bReset">↺ 复位</button>
  </div>
</div>

/* ============ 启动保护 ============ */
function showStatus(msg, kind){
  const s=document.getElementById('status');
  s.textContent=msg; s.classList.add('show');
  s.classList.remove('err','ok');
  if(kind) s.classList.add(kind);
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(()=>s.classList.remove('show'), 3500);
}
function setProgress(text, pct){
  document.getElementById('progText').textContent = text;
  const bar = document.getElementById('progBar');
  if(bar) bar.style.width = (pct||0) + '%';
}
function hideProgress(){
  document.getElementById('progress').classList.add('hide');
}
window.addEventListener('error', function(e){
  const msg=(e&&(e.message||(e.error&&e.error.message)))||'未知错误';
  showStatus('⚠️ '+msg,'err');
});
window.addEventListener('unhandledrejection', function(e){
  const r=e&&(e.reason&&(e.reason.message||e.reason))||'未知错误';
  showStatus('⚠️ Promise: '+r,'err');
});

/* ============ Three.js 场景 ============ */

/* ============ 模型加载（外表面 + 骨骼） ============
 * 模型坐标系: X=前后, Y=左右, Z=上下(身高)
 * three.js:   X=左右, Y=上下, Z=前后
 * 转换: 让模型 (x,y,z) → three.js (y, z, x)  (轴交换 + 重新 fit 到 1.7m)
 */
const modelGroup = new THREE.Group();
/* world 组：把人体模型 + 经络层放进同一个父组，统一绕 Y 轴旋转，
 * 这样旋转后穴位经络仍与人体对齐（不会各转各的） */
const world = new THREE.Group();

/* 按 bounding box 自动检测 height 轴 → 对齐到 three.js Y（修正版）
 * 实测：用户口述的轴约定（x=前/y=左/右/z=上）跟 FBX 实际不符，文件最长轴是 X，
 *   所以必须靠 bbox 自动检测，不能硬编码 AXIS_SWAP。
 * 步骤：
 *   1. 取最长轴=height(H)、中间=width(M)、最短=thickness(T)
 *   2. 构造映射 cols = [T, H, M] → world X←T, world Y←H(up), world Z←M
 *   3. 若 det<0（M/T 互换得到镜像），交换成 cols=[M,H,T] 保证 proper rotation
 *   4. 缩放到 1.7m、居中(xz)、落地(y=min) */
function fitAndOrient(obj, targetH=1.7){
  obj.updateMatrixWorld(true);
  const b0 = new THREE.Box3().setFromObject(obj);
  const s0 = b0.getSize(new THREE.Vector3());
  const axes = [
    {name:'x', size:s0.x},
    {name:'y', size:s0.y},
    {name:'z', size:s0.z}
  ];
  axes.sort((a,b) => b.size - a.size);
  const H = axes[0].name, M = axes[1].name, T = axes[2].name;
  const fromVec = {x:new THREE.Vector3(1,0,0), y:new THREE.Vector3(0,1,0), z:new THREE.Vector3(0,0,1)};
  let cols = [T, H, M];
  const m = new THREE.Matrix4().makeBasis(fromVec[cols[0]], fromVec[cols[1]], fromVec[cols[2]]);
  if (m.determinant() < 0) cols = [M, H, T], m.makeBasis(fromVec[cols[0]], fromVec[cols[1]], fromVec[cols[2]]);
  obj.quaternion.setFromRotationMatrix(m);
  obj.scale.set(1, 1, 1);
  obj.updateMatrixWorld(true);
  /* 缩放：世界 Y 方向 = targetH(1.7m) */
  const b = new THREE.Box3().setFromObject(obj);
  const s = b.getSize(new THREE.Vector3());
  const sc = targetH / (s.y || 1);
  obj.scale.set(sc, sc, sc);
  obj.updateMatrixWorld(true);
  /* 居中（xz） + 落地（y=min） */
  const nb = new THREE.Box3().setFromObject(obj);
  const nc = nb.getCenter(new THREE.Vector3());
  obj.position.x -= nc.x;
  obj.position.z -= nc.z;
  obj.position.y -= nb.min.y;
  obj.updateMatrixWorld(true);
}

/* 朝向预设：fitAndOrient 已按 bbox 自动对齐 height→Y，
 * 但 FBX 源建模软件偶尔会残留额外旋转，提供 5 种朝向让用户手动校正 */
const MODEL_ORIENTATIONS = [
  {rx: 0,             ry: 0,             rz: 0,             name: '默认'},
  {rx: Math.PI,       ry: 0,             rz: 0,             name: '上下颠倒'},
  {rx: 0,             ry: Math.PI,       rz: 0,             name: '前后翻转'},
  {rx: 0,             ry: 0,             rz: Math.PI,       name: '左右镜像'},
  {rx: Math.PI/2,     ry: 0,             rz: 0,             name: '立起来(X转90°)'}
];
let modelOrientIdx = 0;
/* 默认整体绕 Y 轴顺时针转 30°（正 Y 旋转 = 屏幕视角下顺时针），
 * 让人体正面更朝向相机（用户反馈当前偏侧面）。仍可继续用「朝向」按钮微调 */
const BASE_YAW = THREE.MathUtils.degToRad(-55);
let userYaw = BASE_YAW;            // 用户用滑块实时微调的偏航角(弧度)
function applyOrient(){
  const o = MODEL_ORIENTATIONS[modelOrientIdx];
  world.rotation.set(o.rx, o.ry + userYaw, o.rz);
}
/* 朝向微调滑块：实时改变 world.rotation.y，旁边显示当前度数 */

})();

function loadBody(){
  return new Promise((resolve, reject)=>{
    setProgress('加载外表面模型…', 30);
    fbxLoader.load(
      'models/human1.fbx',
      (obj)=>{
        obj.traverse(o=>{
          if(o.isMesh){
            /* 提升亮度：emissive 白 + map 一并作为 emissiveMap */
            const oldMap = o.material && o.material.map;
            o.material = new THREE.MeshStandardMaterial({
              color: 0xb1a99c,
              map: oldMap || null,
              emissive: 0xffffff,
              emissiveMap: oldMap || null,
              emissiveIntensity: 0.6,
              transparent: true,
              opacity: 0.85,
              depthWrite: true,
              roughness: 0.7,
              metalness: 0.05,
              side: THREE.FrontSide

          }
        });

          setProgress('外表面加载中…'+Math.floor(pct)+'%', pct);

/* ============ 皮肤贴合（表面投影 / surface snapping） ============
 * 原理：不靠 UV 裁剪+蒙皮（那是给"骨骼驱动网格动画"用的），而是把经络采样点
 * 投影到"最近的皮肤三角面"上，再沿表面法线外推极小距离（mm 级），
 * 使线条逐点紧贴皮肤。这能解决全局旋转修不了的"不同部位各自偏差"。
 * 计算在"人体自身空间"（body space = 去掉 world 旋转后的世界）进行，
 * 结果与 userYaw/朝向无关，人体怎么转经络都贴着皮。
 */
let _skinSnapCache = null;
function buildSkinSnap(){
  if(_skinSnapCache) return _skinSnapCache;
  world.updateMatrixWorld(true);
  const invW = world.matrixWorld.clone().invert();
  const tris = [];
  if(bodyMesh){
    bodyMesh.updateMatrixWorld(true);
    bodyMesh.traverse(o=>{
      if(!o.isMesh || !o.geometry) return;
      const g = o.geometry, pos = g.attributes.position;
      if(!pos) return;
      const toBody = invW.clone().multiply(o.matrixWorld);
      const vA=new THREE.Vector3(),vB=new THREE.Vector3(),vC=new THREE.Vector3();
      const idx = g.index;
      const triCount = idx ? idx.count/3 : pos.count/3;
      for(let t=0;t<triCount;t++){
        let ia,ib,ic;
        if(idx){ ia=idx.getX(t*3); ib=idx.getX(t*3+1); ic=idx.getX(t*3+2); }
        else { ia=t*3; ib=t*3+1; ic=t*3+2; }
        vA.fromBufferAttribute(pos,ia).applyMatrix4(toBody);
        vB.fromBufferAttribute(pos,ib).applyMatrix4(toBody);
        vC.fromBufferAttribute(pos,ic).applyMatrix4(toBody);
        tris.push([vA.clone(), vB.clone(), vC.clone()]);
      }
    });
  }
  /* 空间哈希：按三角面重心分桶，查询时只检查邻近桶 */
  const cell = 0.12, hash = new Map();
  const key=(x,y,z)=>Math.floor(x/cell)+'_'+Math.floor(y/cell)+'_'+Math.floor(z/cell);
  tris.forEach(tr=>{
    const cx=(tr[0].x+tr[1].x+tr[2].x)/3, cy=(tr[0].y+tr[1].y+tr[2].y)/3, cz=(tr[0].z+tr[1].z+tr[2].z)/3;
    const k=key(cx,cy,cz);
    if(!hash.has(k)) hash.set(k,[]);
    hash.get(k).push(tr);
  });
  _skinSnapCache = {tris, hash, cell, key};
  return _skinSnapCache;
}
/* 点到三角形最近点（Ericson 标准算法），返回 {p:Vector3} */
function closestOnTri(p, a, b, c){
  const ab=b.clone().sub(a), ac=c.clone().sub(a), ap=p.clone().sub(a);
  const d1=ab.dot(ap), d2=ac.dot(ap);
  if(d1<=0&&d2<=0) return {p:a.clone()};
  const bp=p.clone().sub(b);
  const d3=ab.dot(bp), d4=ac.dot(bp);
  if(d3>=0&&d4<=d3) return {p:b.clone()};
  const vc=d1*d4-d3*d2;
  if(vc<=0&&d1>=0&&d3<=0){ const v=d1/(d1-d3); return {p:a.clone().add(ab.multiplyScalar(v))}; }
  const cp=p.clone().sub(c);
  const d5=ab.dot(cp), d6=ac.dot(cp);
  if(d6>=0&&d5<=d6) return {p:c.clone()};
  const vb=d5*d2-d1*d6;
  if(vb<=0&&d2>=0&&d6<=0){ const w=d2/(d2-d6); return {p:a.clone().add(ac.multiplyScalar(w))}; }
  const va=d3*d6-d5*d4;
  if(va<=0&&(d4-d3)>=0&&(d5-d6)>=0){ const w=(d4-d3)/((d4-d3)+(d5-d6)); return {p:b.clone().add(c.clone().sub(b).multiplyScalar(w))}; }
  const denom=1/(va+vb+vc), v=vb*denom, w=vc*denom;
  return {p:a.clone().add(ab.multiplyScalar(v)).add(ac.multiplyScalar(w))};
}
/* 在皮肤网格上找 pt 的最近点（世界/人体空间一致），返回 {point, normal} 或 null */
function snapToSkin(pt, snap){
  const c=snap.cell;
  let best=null, bestD=Infinity, bestTri=null;
  for(let r=0;r<=3;r++){
    const minX=Math.floor((pt.x-r*c)/c), maxX=Math.floor((pt.x+r*c)/c);
    const minY=Math.floor((pt.y-r*c)/c), maxY=Math.floor((pt.y+r*c)/c);
    const minZ=Math.floor((pt.z-r*c)/c), maxZ=Math.floor((pt.z+r*c)/c);
    for(let ix=minX;ix<=maxX;ix++)
      for(let iy=minY;iy<=maxY;iy++)
        for(let iz=minZ;iz<=maxZ;iz++){
          const arr=snap.hash.get(ix+'_'+iy+'_'+iz);
          if(!arr) continue;
          for(const tr of arr){
            const r2=closestOnTri(pt, tr[0], tr[1], tr[2]);
            const dd=pt.distanceToSquared(r2.p);
            if(dd<bestD){ bestD=dd; best=r2.p.clone(); bestTri=tr; }
          }
        }
  }
  if(!best || !bestTri) return null;
  /* 法线取命中三角面的面法线，方向统一"背离身体中心(0,0.85,0)"（朝体外） */
  const e1=bestTri[1].clone().sub(bestTri[0]), e2=bestTri[2].clone().sub(bestTri[0]);
  const n=e1.cross(e2).normalize();
  if(n.dot(best.clone().sub(new THREE.Vector3(0,0.85,0)))<0) n.negate();
  return {point:best, normal:n};
}

  }
})();

/* ============ 经络层 ============ */
function setupMeridians(){
  const meridianGroup = new THREE.Group();
  /* 关键修正：经络层挂到 world（与人体同一父组），人体旋转时经络一起转，不再漂移。
   * 经络与人体的"相对角度"由下方 meridianYawDeg（"经络对齐"滑块）单独控制。 */
  world.add(meridianGroup);

  const visibleMeridians = new Set();

  const flowUniforms = {time:{value:0}, color:{value:new THREE.Color(0xff3030)}};
  function makeFlowMat(){
    return new THREE.ShaderMaterial({
      uniforms:{time:{value:0}, color:{value:new THREE.Color(0xff3030)}},
      transparent:true,
      depthWrite:false,
      blending:THREE.AdditiveBlending,
      vertexShader:`
        varying vec2 vUv;
        void main(){
          vUv=uv;
          gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
        }
      `,
      fragmentShader:`
        uniform float time;
        uniform vec3 color;
        varying vec2 vUv;
        void main(){
          /* 沿 length (vUv.x, 与采集顺序一致) 流动;
           * 高频 22 个粒子, sin 时间偏移让纹理沿管线"跑".
           * pow(w, 8.0) 制造"高峰+平段"的经脉气流感,
           * 不再绕环周 (vUv.y) 做旋转花纹那样看不出方向. */
          float w=sin((vUv.x*22.0)-time*5.0)*0.5+0.5;
          float a=pow(w, 8.0)*0.85;
          gl_FragColor=vec4(color, a);
        }
      `
    });
  }

  const ptMat = new THREE.MeshBasicMaterial({color:0xfff2a8});
  const ptGeom = new THREE.SphereGeometry(0.012, 8, 6);

  function makeLabel(text, color){
    const c=document.createElement('canvas'); c.width=256; c.height=64;
    const g=c.getContext('2d');
    g.fillStyle='rgba(0,0,0,0)'; g.fillRect(0,0,c.width,c.height);
    g.font='bold 30px system-ui,PingFang SC,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.shadowColor='rgba(0,0,0,.85)'; g.shadowBlur=4; g.shadowOffsetY=1;
    g.fillStyle='#'+color.toString(16).padStart(6,'0');
    g.fillText(text, c.width/2, c.height/2);
    const tex=new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearFilter;
    return new THREE.Sprite(new THREE.SpriteMaterial({map:tex, depthTest:false, depthWrite:false}));
  }

  /* 经络相对人体的偏航(由"经络对齐"滑块控制,±90°):
   * meridianGroup 已挂到 world(与人体一起旋转),此角度只用于补偿
   * pts 手写坐标与模型正面的残差。贴皮时也按此角度先把点转到
   * 人体空间再投影,保证滑块调整后仍能重新贴合。 */
  let meridianYawDeg = 0;
  const rotY = (p, deg)=>{
    const a=THREE.MathUtils.degToRad(deg), c=Math.cos(a), s=Math.sin(a);
    return new THREE.Vector3(p.x*c - p.z*s, p.y, p.x*s + p.z*c);
  };

  const mRecords = [];
  MERIDIANS.forEach(m=>{
    /* y 缩放到身高 1.7 时已经一致，不用额外缩放 */
    const basePts = m.pts.map(p=>new THREE.Vector3(p[0], p[1], p[2]));
    /* pts 本身就是皮肤附近坐标, 直接用 */
    const pts3 = basePts.map(p=>p);
    const tube = new THREE.CatmullRomCurve3(pts3, false, 'catmullrom', 0.2);
    const segs = Math.max(48, pts3.length*8);
    const tubeGeom = new THREE.TubeGeometry(tube, segs, 0.008, 8, false);
    const tubeMat = new THREE.MeshBasicMaterial({color:m.color, transparent:true, opacity:0.85, depthTest:true});
    const tubeMesh = new THREE.Mesh(tubeGeom, tubeMat);
    tubeMesh.visible = false;
    meridianGroup.add(tubeMesh);

    const flowMesh = new THREE.Mesh(new THREE.TubeGeometry(tube, segs, 0.014, 12, false), makeFlowMat());
    flowMesh.visible = false;
    meridianGroup.add(flowMesh);

    const ptsGroup = new THREE.Group();
    ptsGroup.visible = false;
    const labelsGroup = new THREE.Group();
    labelsGroup.visible = false;

    /* 穴位数常大于线点数：越界时用 t=i/(N-1) 沿管线插值取点，绝不返回 undefined */
    const acN = m.acupoints.length;
    m.acupoints.forEach((name, i)=>{
      let pos;
      if(i < pts3.length){
        pos = pts3[i];
      }else{
        const t = acN === 1 ? 0.5 : i / (acN - 1);
        pos = tube.getPoint(t);
      }
      if(!pos){ return; }   /* 双重保险 */
      const sphere = new THREE.Mesh(ptGeom, ptMat);
      sphere.position.copy(pos);
      ptsGroup.add(sphere);

      const sprite = makeLabel(name, m.color.replace('#',''));
      sprite.position.set(pos.x, pos.y+0.03, pos.z);
      sprite.scale.set(0.10, 0.025, 1);
      labelsGroup.add(sprite);
    });

    meridianGroup.add(ptsGroup);
    meridianGroup.add(labelsGroup);

    mRecords.push({id:m.id, name:m.name, color:m.color, tubeMesh, flowMesh, ptsGroup, labelsGroup, acupoints:m.acupoints, tube, acupointsCount:m.acupoints.length, basePts, baseCurve:tube});
  });

  function setMeridianVisible(id, on){
    const r = mRecords.find(x=>x.id===id);
    if(!r) return;
    r.tubeMesh.visible = on;
    r.flowMesh.visible = on && flowVisible;
    r.ptsGroup.visible = on && pointsVisible;
    r.labelsGroup.visible = on && labelsVisible;
    if(on) visibleMeridians.add(id); else visibleMeridians.delete(id);
  }
  function refreshAll(){
    mRecords.forEach(r=>{
      const on = visibleMeridians.has(r.id);
      r.tubeMesh.visible = on;
      r.flowMesh.visible = on && flowVisible;
      r.ptsGroup.visible = on && pointsVisible;
      r.labelsGroup.visible = on && labelsVisible;
    });
  }

  /* 列表点击 */
  const mList = document.getElementById('mList');
  mRecords.forEach(r=>{
    const row = document.createElement('div');
    row.className='mRow';
    row.dataset.id=r.id;
    row.innerHTML='<span class="dot"></span><span>'+r.name+'</span><span class="meta">'+r.color+'</span>';
    row.style.setProperty('--c', r.color);
    row.onclick=()=>{
      const on = !row.classList.contains('on');
      row.classList.toggle('on', on);
      setMeridianVisible(r.id, on);
      controls.target.set(0,0.85,0);
      camera.position.set(2.0, 1.0, 2.8); controls.update();
    };
    mList.appendChild(row);
  });

  /* 控制条 */
  document.getElementById('bBody').onclick = ()=>{
    bodyVisible = !bodyVisible;
    if(bodyMesh) bodyMesh.visible = bodyVisible;
    document.getElementById('bBody').classList.toggle('on', bodyVisible);
    showStatus(bodyVisible?'显示外表面':'隐藏外表面');
  };
  document.getElementById('bBone').onclick = ()=>{
    boneVisible = !boneVisible;
    if(boneMesh) boneMesh.visible = boneVisible;
    if(boneLabelGroup) boneLabelGroup.visible = boneVisible && boneLabelsOn;
    document.getElementById('bBone').classList.toggle('on', boneVisible);
    showStatus(boneVisible?'显示骨骼':'隐藏骨骼');
  };
  document.getElementById('bPoints').onclick = ()=>{
    pointsVisible = !pointsVisible;
    refreshAll();
    document.getElementById('bPoints').classList.toggle('on', pointsVisible);
    showStatus(pointsVisible?'显示穴位点':'隐藏穴位点');
  };
  document.getElementById('bLabels').onclick = ()=>{
    labelsVisible = !labelsVisible;
    refreshAll();
    document.getElementById('bLabels').classList.toggle('on', labelsVisible);
    showStatus(labelsVisible?'显示穴位名':'隐藏穴位名');
  };
  document.getElementById('bFlow').onclick = ()=>{
    flowVisible = !flowVisible;
    refreshAll();
    document.getElementById('bFlow').classList.toggle('on', flowVisible);
    showStatus(flowVisible?'气运动显示':'气运动关闭');
  };
  document.getElementById('bReset').onclick = ()=>{
    controls.target.set(0,0.85,0);
    camera.position.set(2.0,1.0,2.8);
    controls.update();
    showStatus('视角已复位');
  };
  /* 朝向切换按钮：循环 5 种模型朝向 */
  const bOrient = document.getElementById('bOrient');
  bOrient.onclick = ()=>{
    modelOrientIdx = (modelOrientIdx + 1) % MODEL_ORIENTATIONS.length;
    applyOrient();
    const o = MODEL_ORIENTATIONS[modelOrientIdx];
    bOrient.textContent = '🔄 朝向 '+(modelOrientIdx+1)+'/'+MODEL_ORIENTATIONS.length+' · '+o.name;
    showStatus('朝向你跟着点击对的那个，看 X红 Y绿 Z蓝 三色坐标轴箭头方向');
  };

  /* 搜索 */
  const sInput = document.getElementById('searchInput');
  const sHint = document.getElementById('searchHint');
  document.getElementById('searchClear').onclick=()=>{ sInput.value=''; sInput.dispatchEvent(new Event('input')); };
  sInput.addEventListener('input', function(){
    const q = sInput.value.trim();
    if(!q){
      mRecords.forEach(r=>{
        const row = document.querySelector('.mRow[data-id="'+r.id+'"]');
        if(row) row.classList.remove('on');
        setMeridianVisible(r.id, false);
      });
      sHint.textContent='';
      controls.target.set(0,0.85,0); camera.position.set(2.0,1.0,2.8); controls.update();
      return;
    }
    const foundMer = mRecords.filter(r=>r.name.includes(q));
    const foundAcus = [];
    mRecords.forEach(r=>{
      (r.acupoints||[]).forEach((ac, i)=>{
        if(ac.includes(q)) foundAcus.push({mid:r.id, ac, idx:i, m:r, tube:r.tube, apLen:r.acupoints.length});
      });
    });
    if(!foundMer.length && !foundAcus.length){
      sHint.textContent='未匹配到结果';
      return;
    }
    mRecords.forEach(r=>{
      const on = foundMer.some(f=>f.id===r.id) || foundAcus.some(f=>f.mid===r.id);
      const row = document.querySelector('.mRow[data-id="'+r.id+'"]');
      if(row) row.classList.toggle('on', on);
      setMeridianVisible(r.id, on);
    });
    if(foundAcus.length){
      const f = foundAcus[0];
      const t = f.idx/(Math.max(1, f.apLen-1));
      const pos = f.tube.getPoint(t);
      controls.target.set(pos.x, pos.y, pos.z);
      camera.position.set(pos.x+0.15, pos.y+0.05, pos.z+0.15);
      controls.update();
      sHint.textContent='已定位到「'+f.ac+'」('+f.m.name+')';
    } else {
      controls.target.set(0,0.85,0); camera.position.set(2.0,1.0,2.8); controls.update();
      sHint.textContent='已打开匹配经络';
    }
  });

  /* 暴露用于调试 */
  window.MERIDIAN_RECORDS = mRecords;
  window.setMeridianVisible = setMeridianVisible;
  window.refreshAll = refreshAll;
  window.__m3d = {
    mRecords, meridianGroup,
    getYaw: ()=>meridianYawDeg,
    setYaw: (deg)=>{ meridianYawDeg=deg; meridianGroup.rotation.y=THREE.MathUtils.degToRad(deg); },
    runSnap, revertSnap, buildSkinSnap, snapToSkin, rotY,
    setMeridianVisible,
    getBody: ()=>bodyMesh,
    getBone: ()=>boneMesh,
    getBoneLabels: ()=>boneLabelGroup,
    getStatus: ()=>document.getElementById('status').textContent
  };

  /* 经络层相对人体的偏航(±90°, "经络对齐"滑块)—— 只修残差角度;
   * meridianGroup 已随 world 与人体一起旋转, 不再需要补偿全局朝向 */
  document.getElementById('meridianYawSlider').addEventListener('input', e => {
    const deg = parseFloat(e.target.value);
    meridianYawDeg = deg;
    document.getElementById('meridianYawVal').textContent = deg + '°';
    meridianGroup.rotation.y = THREE.MathUtils.degToRad(deg);
    if(snapOn) runSnap(parseFloat(document.getElementById('offsetSlider').value)/1000);
  });
  meridianGroup.rotation.y = THREE.MathUtils.degToRad(meridianYawDeg);   /* 默认 0 */

  /* ============ 自动贴合（表面投影） ============ */
  let snapOn = false;
  /* 用一组点(人体空间→经络局部)重建整条经络的管线/流动/穴位/标签 */
  function rebuild(r, curve){
    const segs = Math.max(48, (curve.points?curve.points.length:16)*4);
    if(r.tubeMesh.geometry) r.tubeMesh.geometry.dispose();
    r.tubeMesh.geometry = new THREE.TubeGeometry(curve, segs, 0.008, 8, false);
    if(r.flowMesh.geometry) r.flowMesh.geometry.dispose();
    r.flowMesh.geometry = new THREE.TubeGeometry(curve, segs, 0.014, 12, false);
    r.tube = curve;
    const baseLen = r.basePts.length, acN = r.acupoints.length;
    r.ptsGroup.children.forEach((sphere, i)=>{
      const t = (i<baseLen) ? i/(baseLen-1) : (acN===1?0.5:i/(acN-1));
      const pos = curve.getPoint(t);
      sphere.position.copy(pos);
      const lab = r.labelsGroup.children[i];
      if(lab) lab.position.set(pos.x, pos.y+0.03, pos.z);
    });
  }
  /* 每条经络: 沿原曲线密集采样 → 按 meridianYaw 转到人体空间 → 投影到最近皮肤面 →
   * 沿法线外推 off 米 → 转回经络局部坐标 → 重建管线 */
  function runSnap(off){
    const skin = buildSkinSnap();
    if(!skin.tris.length){ showStatus('⚠️ 皮肤网格为空, 无法贴合','err'); return; }
    mRecords.forEach(r=>{
      const baseCurve = r.baseCurve;
      const N = 32;                                  /* 每条经络采样 33 个点, 管线更顺滑 */
      const snapped = [];
      for(let i=0;i<=N;i++){
        const P = baseCurve.getPoint(i/N);           /* 人体空间采样点 */
        const Q = rotY(P, meridianYawDeg);           /* 转到渲染时的实际朝向 */
        const S = snapToSkin(Q, skin);
        if(!S){ snapped.push(rotY(P, -meridianYawDeg)); continue; }
        snapped.push(rotY(S.point.clone().add(S.normal.clone().multiplyScalar(off)), -meridianYawDeg));
      }
      const curve = new THREE.CatmullRomCurve3(snapped, false, 'catmullrom', 0.2);
      rebuild(r, curve);
    });
    showStatus('✅ 已贴合皮肤（偏移 '+Math.round(off*1000)+'mm · 逐点投影）','ok');
  }
  function revertSnap(){
    mRecords.forEach(r=> rebuild(r, r.baseCurve));
    showStatus('↩ 已恢复手工坐标');
  }
  document.getElementById('bSnap').onclick = ()=>{
    snapOn = !snapOn;
    document.getElementById('bSnap').classList.toggle('on', snapOn);
    if(snapOn) runSnap(parseFloat(document.getElementById('offsetSlider').value)/1000);
    else revertSnap();
  };
  document.getElementById('offsetSlider').addEventListener('input', e=>{
    const mm = parseFloat(e.target.value);
    document.getElementById('offsetVal').textContent = mm + 'mm';
    if(snapOn) runSnap(mm/1000);
  });

  /* ============ 骨骼名标签 ============
   * 骨骼模型往往不命名(AI 生成的整体网格),采用两套策略:
   * 1) 模型有 ≥3 个 mesh 且各自带名字 → 直接显示模型自带名字
   * 2) 模型是整体网格(1~2 mesh,像 guge1.fbx)→ 按标准人体解剖部位
   *    自动标注 19 个核心骨头名(颅/颈/肩胛/胸/肱/腰/骨盆/尺桡/腕掌/
   *    股/胫腓/跗),body space 固定坐标定位,与骨骼模型对齐显示。 */
  let boneLabelsBuilt=false, boneLabelGroup=null, boneLabelsOn=false;
  /* 标准 1.7m 人体解剖学标签(body space, x 左右, y 身高, z 前后) */
  const ANATOMY_BONES = [
    ['颅骨',         0,    1.60,  0.06],
    ['颈椎',         0,    1.46, -0.03],
    ['锁/肩胛骨',    0,    1.33, -0.10],
    ['胸骨',         0,    1.20,  0.10],
    ['胸椎',         0,    1.18, -0.12],
    ['肱骨(左)',    -0.24,  1.05,  0   ],
    ['肱骨(右)',     0.24,  1.05,  0   ],
    ['腰椎',         0,    0.95, -0.12],
    ['尺/桡骨(左)', -0.27,  0.82,  0   ],
    ['尺/桡骨(右)',  0.27,  0.82,  0   ],
    ['骨盆/髋骨',    0,    0.72,  0   ],
    ['腕/掌骨(左)', -0.31,  0.60,  0   ],
    ['腕/掌骨(右)',  0.31,  0.60,  0   ],
    ['股骨(左)',    -0.13,  0.45,  0   ],
    ['股骨(右)',     0.13,  0.45,  0   ],
    ['胫/腓骨(左)', -0.13,  0.18,  0   ],
    ['胫/腓骨(右)',  0.13,  0.18,  0   ],
    ['跗骨/足(左)', -0.12,  0.04,  0.10],
    ['跗骨/足(右)',  0.12,  0.04,  0.10]
  ];
  function buildBoneLabels(){
    if(boneLabelsBuilt) return;
    boneLabelGroup = new THREE.Group();
    world.add(boneLabelGroup);                       /* 挂 world: 人体怎么转标签怎么转 */
    let count = 0;
    if(boneMesh){
      /* 判断骨骼模型是分块命名 还是 整体网格 */
      let meshCount = 0, namedCount = 0;
      boneMesh.traverse(o=>{
        if(!o.isMesh || !o.geometry) return;
        meshCount++;
        const nm = (o.name||'').trim();
        if(nm && /[\u4e00-\u9fa5a-zA-Z]/.test(nm) && !/^(group|null|object\d*)$/i.test(nm)) namedCount++;
      });
      if(namedCount >= 3){
        /* 策略 1: 模型自带足够多命名 → 用模型名字 */
        boneMesh.updateMatrixWorld(true);
        const invW = world.matrixWorld.clone().invert();
        const tmp = new THREE.Vector3();
        boneMesh.traverse(o=>{
          const nm=(o.name||'').trim();
          if(!nm || !/[\u4e00-\u9fa5a-zA-Z]/.test(nm) || /^(group|null|object\d*)$/i.test(nm)) return;
          if(!(o.isBone||o.isMesh)) return;
          tmp.setFromMatrixPosition(invW.clone().multiply(o.matrixWorld));
          const sprite = makeLabel(nm, 'ffe9b0');
          sprite.position.copy(tmp);
          sprite.scale.set(0.18, 0.045, 1);
          boneLabelGroup.add(sprite);
          count++;
        });
        showStatus('🦴 骨骼（模型自带名）'+count+' 个 · 点「骨骼名」开关显示', 'ok');
      } else {
        /* 策略 2: 整体骨骼网格(AI 生成常见)→ 自动按解剖部位标注 */
        ANATOMY_BONES.forEach(([nm, x, y, z])=>{
          const sprite = makeLabel(nm, 'ffe9b0');
          sprite.position.set(x, y, z);
          sprite.scale.set(0.18, 0.045, 1);
          boneLabelGroup.add(sprite);
          count++;
        });
        showStatus('🦴 骨骼模型无分块命名,已自动按解剖部位标注 '+count+' 块骨头(颅/颈/肩胛/胸/肱/腰/骨盆/尺桡/腕掌/股/胫腓/跗) · 点「骨骼名」显示', 'ok');
      }
    }
    boneLabelsBuilt = true;
    boneLabelGroup.visible = false;
  }
  document.getElementById('bBoneLabels').onclick = ()=>{
    buildBoneLabels();
    boneLabelsOn = !boneLabelsOn;
    document.getElementById('bBoneLabels').classList.toggle('on', boneLabelsOn);
    if(boneLabelGroup) boneLabelGroup.visible = boneLabelsOn && boneVisible;
    showStatus(boneLabelsOn?'显示骨骼名':'隐藏骨骼名');
  };

  const totalAcus = mRecords.reduce((s,r)=>s+r.acupointsCount,0);
  showStatus('✅ 就绪 · 共14条经络 · '+totalAcus+' 穴位', 'ok');
}

/* ============ 渲染循环 ============ */
let frame = 0;
function tick(){
  requestAnimationFrame(tick);
  frame += 0.016;
  if(window.MERIDIAN_RECORDS){
    window.MERIDIAN_RECORDS.forEach(r=>{
      if(r.flowMesh && r.flowMesh.material && r.flowMesh.material.uniforms){
        r.flowMesh.material.uniforms.time.value = frame;
      }
    });
  }
  controls.update();
  renderer.render(scene, camera);
}
tick();

window.addEventListener('resize', ()=>{
  camera.aspect = stage.clientWidth/stage.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(stage.clientWidth, stage.clientHeight);
});
</script>
</body>
</html>
