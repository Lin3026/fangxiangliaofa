<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>经络穴位图</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f7f5; color: #2b3a34; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* 顶部：标题 + 搜索 */
  header { padding: 8px 12px; background: #2f8f6f; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; }
  #searchbar { display: flex; gap: 6px; margin-top: 6px; }
  #searchInput { flex: 1; min-height: 36px; padding: 0 12px; border-radius: 18px;
    border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.15); color: #fff;
    font-size: 14px; outline: none; backdrop-filter: blur(4px); }
  #searchInput::placeholder { color: rgba(255,255,255,.7); }
  #btnSearch { min-height: 36px; padding: 0 14px; border-radius: 18px; border: 0;
    background: #fff; color: #2f8f6f; font-size: 14px; font-weight: 600; cursor: pointer; }

  /* 主视图区 */
  #stage { flex: 1; position: relative; overflow: hidden; background: #fafdfb; }
  #meridianSvg { width: 100%; height: 100%; display: block; touch-action: pinch-zoom; }

  /* 穴位名称 tooltip */
  .ptip { position: absolute; background: rgba(20,28,38,.95); color: #fff; font-size: 12px;
    padding: 4px 8px; border-radius: 6px; pointer-events: none; z-index: 10;
    white-space: nowrap; transform: translate(-50%, -120%); opacity: 0; transition: opacity .15s; }
  .ptip.show { opacity: 1; }

  /* 状态提示 */
  #status { position: absolute; top: 8px; right: 8px; padding: 4px 10px;
    background: rgba(40,55,48,.92); color: #eafff7; font-size: 12px; border-radius: 14px;
    pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 10; max-width: 70%; }
  #status.show { opacity: 1; }

  /* 控制条 */
  #ctrl { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px;
    justify-content: center; background: #fff; border-top: 1px solid #e2eae5; }
  .btn { min-height: 36px; padding: 0 12px; border-radius: 18px;
    border: 1px solid #c5d3cc; background: #fff; color: #2b3a34; font-size: 13px; cursor: pointer; }
  .btn.on { background: #1e6f5c; border-color: #1e6f5c; color: #eafff7; }
  .btn:active { background: #25313f; color: #fff; }
  .btn.on:active { background: #28a98c; }

  /* 经络列表 */
  #panel { position: absolute; top: 8px; left: 8px; max-height: 50%; overflow-y: auto;
    background: rgba(255,255,255,.96); border: 1px solid #e2eae5; border-radius: 10px;
    padding: 4px; box-shadow: 0 4px 12px rgba(0,0,0,.08); width: 140px; z-index: 5; }
  #panel h4 { margin: 4px 6px; font-size: 12px; color: #6b7d74; font-weight: 600; }
  .mrow { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px;
    cursor: pointer; font-size: 12.5px; user-select: none; }
  .mrow:hover { background: #eef4f1; }
  .mrow.off { opacity: .35; }
  .mdot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .mrow.off .mdot { background: #999 !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🌿 人体经络穴位图（2D 版）</h1>
    <div id="searchbar">
      <input id="searchInput" type="search" placeholder="搜索穴位或经络，如 足三里 / 肺经" />
      <button id="btnSearch">定位</button>
    </div>
  </header>
  <div id="stage">
    <svg id="meridianSvg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid meet">
      <!-- 人体轮廓（简化的火柴人/侧身） -->
      <g id="body" fill="none" stroke="#cfd8d2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- 头 -->
        <ellipse cx="200" cy="60" rx="22" ry="26" />
        <!-- 颈 -->
        <path d="M 188 84 Q 200 92 212 84" />
        <!-- 躯干（侧面） -->
        <path d="M 200 92 L 195 150 L 198 220 L 196 290 L 200 360 L 198 420 L 202 500 L 200 540" />
        <!-- 肩膀+手臂（左右各画一侧） -->
        <path d="M 196 100 Q 165 110 145 150 L 138 220 Q 132 270 128 320 L 130 380" />
        <path d="M 204 100 Q 235 110 255 150 L 262 220 Q 268 270 272 320 L 270 380" />
        <!-- 臀部+腿 -->
        <path d="M 200 500 Q 180 510 175 550 L 172 640 Q 170 700 172 760 L 174 790" />
        <path d="M 200 500 Q 220 510 225 550 L 228 640 Q 230 700 228 760 L 226 790" />
        <!-- 脚（简化） -->
        <path d="M 165 790 L 192 790" />
        <path d="M 208 790 L 235 790" />
      </g>
      <!-- 14 条经络的线和穴位会动态插入到这里 -->
      <g id="meridianLayer"></g>
    </svg>
    <div id="ptip" class="ptip"></div>
    <div id="status"></div>
    <div id="panel">
      <h4>经络（点击显隐）</h4>
      <div id="mList"></div>
    </div>
  </div>
  <div id="ctrl">
    <button class="btn on" id="btnLabels">🏷 穴位名</button>
    <button class="btn on" id="btnPoints">⦿ 穴位点</button>
    <button class="btn on" id="btnFlow">🌀 气运动</button>
    <button class="btn" id="btnView">正面/背面</button>
    <button class="btn" id="btnReset">↺ 复位</button>
  </div>
</div>

<script>
/* ============ 经络数据（每条经络：3D 坐标 [x, y, z]，y 是高度，z 正=前 负=后） ============
   坐标系：x 0~0.5 横向，y 0~1.7 高度（0=脚底），z -0.10~+0.14 前后
   投影到 SVG viewBox(0 0 400 800)：
     svgX = (x / 0.5) * 400 = x * 800
     svgY = (1 - y / 1.7) * 800
     z 决定显示前/背（按钮切换） */
const MERIDIANS = [
  { id:'ren', name:'任脉', color:'#ff5fa2', side:'M', pts:[
    ['会阴',0,0.06,0.10],['曲骨',0,0.78,0.13],['关元',0,0.88,0.13],['气海',0,0.95,0.13],
    ['神阙',0,1.00,0.14],['中脘',0,1.10,0.13],['膻中',0,1.32,0.12],['天突',0,1.45,0.10],['承浆',0,1.50,0.10]
  ]},
  { id:'du', name:'督脉', color:'#ffd24a', side:'M', pts:[
    ['长强',0,0.12,-0.10],['命门',0,1.00,-0.10],['大椎',0,1.42,-0.04],['风府',0,1.55,-0.03],
    ['百会',0,1.70,0],['印堂',0,1.58,0.10],['水沟',0,1.50,0.12]
  ]},
  { id:'lu', name:'手太阴肺经', color:'#6fd3ff', side:'LR', pts:[
    ['中府',0.16,1.30,0.10],['尺泽',0.30,1.08,0.02],['列缺',0.38,0.86,0.06],['太渊',0.40,0.84,0.04],['少商',0.45,0.72,0.04]
  ]},
  { id:'li', name:'手阳明大肠经', color:'#7CFC00', side:'LR', pts:[
    ['商阳',0.45,0.72,0.04],['合谷',0.42,0.80,0.06],['曲池',0.32,1.08,0.04],['肩髃',0.18,1.36,0.02],['迎香',0.04,1.50,0.13]
  ]},
  { id:'st', name:'足阳明胃经', color:'#ff9f43', side:'LR', pts:[
    ['承泣',0.04,1.52,0.13],['地仓',0.05,1.48,0.13],['缺盆',0.12,1.34,0.06],['天枢',0.10,0.95,0.14],
    ['梁丘',0.12,0.56,0.05],['足三里',0.12,0.55,0.04],['丰隆',0.12,0.30,0.06],['厉兑',0.11,0.03,0.14]
  ]},
  { id:'sp', name:'足太阴脾经', color:'#c792ea', side:'LR', pts:[
    ['隐白',0.13,0.03,0.12],['公孙',0.12,0.07,0.11],['三阴交',0.11,0.10,0.10],['阴陵泉',0.12,0.50,0.04],
    ['血海',0.13,0.62,0.02],['大横',0.09,0.95,0.12],['大包',0.16,1.18,0.04]
  ]},
  { id:'ht', name:'手少阴心经', color:'#ff6b81', side:'LR', pts:[
    ['极泉',0.17,1.35,0.06],['少海',0.31,1.10,0.04],['神门',0.39,0.85,0.05],['少冲',0.44,0.72,0.04]
  ]},
  { id:'si', name:'手太阳小肠经', color:'#4dd0e1', side:'LR', pts:[
    ['少泽',0.44,0.72,0.03],['小海',0.31,1.10,0.03],['肩贞',0.18,1.34,0.03],['听宫',0.07,1.52,0.10]
  ]},
  { id:'bl', name:'足太阳膀胱经', color:'#5c6bc0', side:'LR', pts:[
    ['睛明',0.03,1.56,0.12],['天柱',0.06,1.45,-0.02],['肺俞',0.10,1.25,-0.07],['肾俞',0.10,0.98,-0.07],
    ['八髎',0.06,0.82,-0.06],['委中',0.10,0.52,-0.05],['承山',0.10,0.25,-0.06],['昆仑',0.11,0.07,-0.05],['至阴',0.11,0.02,-0.04]
  ]},
  { id:'ki', name:'足少阴肾经', color:'#9ccc65', side:'LR', pts:[
    ['涌泉',0.11,0.02,0.14],['太溪',0.11,0.08,0.10],['阴谷',0.10,0.52,0.02],['肓俞',0.08,0.95,-0.02],['俞府',0.12,1.30,0.06]
  ]},
  { id:'pc', name:'手厥阴心包经', color:'#f06292', side:'LR', pts:[
    ['天池',0.14,1.25,0.08],['曲泽',0.30,1.08,0.04],['内关',0.39,0.85,0.05],['劳宫',0.43,0.78,0.05],['中冲',0.44,0.72,0.05]
  ]},
  { id:'te', name:'手少阳三焦经', color:'#ffb74d', side:'LR', pts:[
    ['关冲',0.44,0.72,0.04],['阳池',0.42,0.80,0.05],['外关',0.39,0.85,0.05],['天井',0.31,1.10,0.04],['丝竹空',0.06,1.54,0.11]
  ]},
  { id:'gb', name:'足少阳胆经', color:'#4db6ac', side:'LR', pts:[
    ['瞳子髎',0.07,1.53,0.11],['风池',0.07,1.45,-0.02],['肩井',0.14,1.38,0.00],['环跳',0.10,0.86,-0.04],
    ['阳陵泉',0.12,0.50,0.03],['悬钟',0.11,0.20,0.05],['足窍阴',0.12,0.03,0.10]
  ]},
  { id:'lr', name:'足厥阴肝经', color:'#81c784', side:'LR', pts:[
    ['大敦',0.12,0.03,0.10],['太冲',0.12,0.08,0.10],['曲泉',0.11,0.52,0.03],['章门',0.13,1.05,0.08],['期门',0.14,1.25,0.08]
  ]}
];

/* ============ 状态 ============ */
let viewMode = 'front'; // 'front' | 'back'
let showLabels = true;
let showPoints = true;
let flowEnabled = true;
let visibleMeridians = new Set(MERIDIANS.map(m => m.id)); // 默认显示全部 14 条经络
const SVG_NS = 'http://www.w3.org/2000/svg';

/* 把 3D 坐标投影到 SVG 2D 坐标 */
function proj(x, y, z, sideSign) {
  // sideSign: 1=右, -1=左
  const sx = (x * sideSign * 0.5 + 0.5) * 400; // 中心 200，0=左边缘
  const sy = (1 - y / 1.7) * 800;
  return { x: sx, y: sy, z };
}

/* ============ 初始化经络列表 ============ */
const mList = document.getElementById('mList');
MERIDIANS.forEach(m => {
  const row = document.createElement('div');
  row.className = 'mrow';
  row.dataset.id = m.id;
  row.innerHTML = `<span class="mdot" style="background:${m.color}"></span><span>${m.name}</span>`;
  row.onclick = function() { toggleMeridian(m.id); };
  mList.appendChild(row);
});

/* ============ 渲染经络（按当前 viewMode） ============ */
const layer = document.getElementById('meridianLayer');
let meridianNodes = []; // { id, line, points, dots, labels, flow }

function renderMeridians() {
  layer.innerHTML = '';
  meridianNodes = [];

  MERIDIANS.forEach(m => {
    const sides = m.side === 'M' ? [1] : [1, -1]; // 中线只画一次，两侧画左右
    sides.forEach(sideSign => {
      const g = document.createElementNS(SVG_NS, 'g');
      g.setAttribute('data-mid', m.id);
      g.setAttribute('data-side', sideSign);

      // 决定透明度：viewMode='front' 时 z<0 用 0.35 透明度（半透明，提示在背面）
      // viewMode='back' 时 z>0 用 0.35
      // 'all' 时全部实色
      const firstZ = m.pts[0][3];
      const belongFront = firstZ >= 0;
      let opa = 1;
      if (viewMode === 'front' && !belongFront) opa = 0.35;
      if (viewMode === 'back' && belongFront) opa = 0.35;

      // 投影所有点
      const projPts = m.pts.map(p => proj(p[1], p[2], p[3], sideSign));

      // 经络线（path）
      const line = document.createElementNS(SVG_NS, 'path');
      const d = projPts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
      line.setAttribute('d', d);
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke', m.color);
      line.setAttribute('stroke-width', '2');
      line.setAttribute('stroke-linecap', 'round');
      line.setAttribute('stroke-linejoin', 'round');
      line.setAttribute('opacity', opa === 1 ? '0.9' : '0.4');
      g.appendChild(line);

      // 穴位圆点
      const dots = [];
      const labels = [];
      projPts.forEach((p, i) => {
        const pt = m.pts[i];
        const dot = document.createElementNS(SVG_NS, 'circle');
        dot.setAttribute('cx', p.x);
        dot.setAttribute('cy', p.y);
        dot.setAttribute('r', '4');
        dot.setAttribute('fill', '#fff');
        dot.setAttribute('stroke', m.color);
        dot.setAttribute('stroke-width', '2');
        dot.style.cursor = 'pointer';
        dot.addEventListener('click', function(e) {
          e.stopPropagation();
          showPointTip(p.x, p.y, pt[0] + ' · ' + m.name);
        });
        g.appendChild(dot);
        dots.push(dot);

        // 穴位名标签
        const lbl = document.createElementNS(SVG_NS, 'text');
        lbl.setAttribute('x', p.x + 6);
        lbl.setAttribute('y', p.y - 4);
        lbl.setAttribute('font-size', '10');
        lbl.setAttribute('fill', '#2b3a34');
        lbl.setAttribute('font-weight', '600');
        lbl.setAttribute('paint-order', 'stroke');
        lbl.setAttribute('stroke', '#fff');
        lbl.setAttribute('stroke-width', '3');
        lbl.textContent = pt[0];
        g.appendChild(lbl);
        labels.push(lbl);
      });

      // 气运动：沿线流动的虚线
      const flow = document.createElementNS(SVG_NS, 'path');
      flow.setAttribute('d', d);
      flow.setAttribute('fill', 'none');
      flow.setAttribute('stroke', m.color);
      flow.setAttribute('stroke-width', '4');
      flow.setAttribute('stroke-linecap', 'round');
      flow.setAttribute('stroke-dasharray', '12 14');
      flow.setAttribute('opacity', opa === 1 ? '0.7' : '0.3');
      if (!flowEnabled) flow.style.display = 'none';
      g.appendChild(flow);

      layer.appendChild(g);
      meridianNodes.push({ id: m.id, side: sideSign, g, line, dots, labels, flow });
    });
  });

  applyVisibility();
  applyLabels();
  applyPoints();
  applyFlow();
}

function applyVisibility() {
  meridianNodes.forEach(n => {
    if (visibleMeridians.has(n.id)) {
      n.g.style.display = '';
      // 给列表行加高亮
      const row = mList.querySelector(`[data-id="${n.id}"]`);
      if (row) row.classList.remove('off');
    } else {
      n.g.style.display = 'none';
      const row = mList.querySelector(`[data-id="${n.id}"]`);
      if (row) row.classList.add('off');
    }
  });
}

function applyLabels() {
  meridianNodes.forEach(n => { n.labels.forEach(l => l.style.display = showLabels ? '' : 'none'); });
}
function applyPoints() {
  meridianNodes.forEach(n => { n.dots.forEach(d => d.style.display = showPoints ? '' : 'none'); });
}
function applyFlow() {
  meridianNodes.forEach(n => { n.flow.style.display = flowEnabled ? '' : 'none'; });
}

function toggleMeridian(id) {
  if (visibleMeridians.has(id)) visibleMeridians.delete(id);
  else visibleMeridians.add(id);
  applyVisibility();
}

/* ============ 穴位提示 ============ */
const ptip = document.getElementById('ptip');
function showPointTip(svgX, svgY, text) {
  const svg = document.getElementById('meridianSvg');
  const rect = svg.getBoundingClientRect();
  // svgX/Y 是 viewBox 坐标 (0-400, 0-800)，需转成屏幕坐标
  const scaleX = rect.width / 400;
  const scaleY = rect.height / 800;
  ptip.style.left = (svgX * scaleX) + 'px';
  ptip.style.top = (svgY * scaleY) + 'px';
  ptip.textContent = text;
  ptip.classList.add('show');
  clearTimeout(showPointTip._t);
  showPointTip._t = setTimeout(() => ptip.classList.remove('show'), 2500);
}
document.getElementById('stage').addEventListener('click', function(e) {
  if (e.target.tagName !== 'circle' && e.target.tagName !== 'text') ptip.classList.remove('show');
});

/* ============ 状态提示 ============ */
const statusEl = document.getElementById('status');
function showStatus(msg) {
  statusEl.textContent = msg;
  statusEl.classList.add('show');
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(() => statusEl.classList.remove('show'), 2500);
}

/* ============ 气运动动画（CSS keyframes 模拟） ============ */
const flowStyle = document.createElement('style');
flowStyle.textContent = `
@keyframes flowMove { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -26; } }
#meridianLayer path[stroke-dasharray] { animation: flowMove 1.2s linear infinite; }
`;
document.head.appendChild(flowStyle);

/* ============ 按钮 ============ */
document.getElementById('btnLabels').onclick = function() {
  showLabels = !showLabels; this.classList.toggle('on', showLabels); applyLabels();
};
document.getElementById('btnPoints').onclick = function() {
  showPoints = !showPoints; this.classList.toggle('on', showPoints); applyPoints();
};
document.getElementById('btnFlow').onclick = function() {
  flowEnabled = !flowEnabled; this.classList.toggle('on', flowEnabled); applyFlow();
};
document.getElementById('btnView').onclick = function() {
  viewMode = viewMode === 'front' ? 'back' : 'front';
  showStatus('已切换到' + (viewMode === 'front' ? '正面' : '背面') + '视图');
  renderMeridians();
};
document.getElementById('btnReset').onclick = function() {
  visibleMeridians.clear();
  renderMeridians();
  showStatus('已复位');
};

/* ============ 搜索 ============ */
function doSearch() {
  const q = (document.getElementById('searchInput').value || '').trim();
  if (!q) { showStatus('请输入穴位或经络名'); return; }
  // 优先匹配穴位名
  for (const m of MERIDIANS) {
    if (m.name.includes(q) || m.id === q.toLowerCase()) {
      visibleMeridians.clear();
      visibleMeridians.add(m.id);
      applyVisibility();
      // 找到第一个穴位显示
      const firstPt = m.pts[0];
      const p = proj(firstPt[1], firstPt[2], firstPt[3], 1);
      showPointTip(p.x, p.y, m.name + ' · ' + m.pts.length + ' 穴');
      showStatus('已定位：' + m.name);
      return;
    }
  }
  // 再匹配穴位
  for (const m of MERIDIANS) {
    const hit = m.pts.find(pt => pt[0].includes(q));
    if (hit) {
      visibleMeridians.clear();
      visibleMeridians.add(m.id);
      applyVisibility();
      const p = proj(hit[1], hit[2], hit[3], 1);
      showPointTip(p.x, p.y, hit[0] + ' · ' + m.name);
      showStatus('已定位穴位：' + hit[0]);
      return;
    }
  }
  showStatus('未找到：' + q);
}
document.getElementById('btnSearch').onclick = doSearch;
document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

/* ============ 启动 ============ */
renderMeridians();
showStatus('点击左侧经络名开启显示 · 点穴位看名称');
</script>
</body>
</html>
